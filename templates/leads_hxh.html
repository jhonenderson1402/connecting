{% extends "base.html" %}
{% block content %}
<style>
  .hh-wrap { overflow-x:auto; border-radius:10px; }
  .hh-table { width:100%; border-collapse:separate; border-spacing:0; font-size:11.5px;
              background:var(--card); min-width:1340px; table-layout:fixed; }
  .hh-table thead th { background:var(--primary); color:var(--primary-fg); font-weight:800;
              text-transform:uppercase; font-size:8.5px; letter-spacing:.3px; padding:9px 4px;
              text-align:center; white-space:nowrap; border-right:1px solid rgba(0,0,0,.08); }
  .hh-table thead th:last-child { border-right:none; }
  .hh-table tbody td { padding:5px 4px; text-align:center; background:var(--card);
              border-bottom:1px solid var(--border); vertical-align:middle; }
  .hh-table tbody tr.alt td { background:var(--secondary); }
  .hh-table tbody tr:hover td { background:var(--secondary); }
  .hh-fx { color:var(--muted-fg); font-weight:500; text-transform:uppercase;
           font-size:9.5px; white-space:nowrap; }
  .hh-dd { width:100%; background:transparent; border:1px solid var(--border); color:var(--fg);
           border-radius:6px; padding:5px 18px 5px 8px; font-size:11.5px; font-family:inherit;
           text-align:left; appearance:none; -webkit-appearance:none; cursor:pointer;
           background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%23a1a1aa' d='M5 6L0 0h10z'/%3E%3C/svg%3E");
           background-repeat:no-repeat; background-position:right 6px center; }
  .hh-nm { width:100%; background:transparent; border:1px solid var(--border); color:var(--fg);
           border-radius:6px; padding:5px 8px; font-size:11.5px; font-family:inherit; }
  .hh-nm:focus, .hh-in:focus { outline:none; border-color:var(--primary); }
  .hh-in { width:100%; background:transparent; border:1px solid var(--border); color:var(--muted-fg);
           text-align:center; padding:5px 0; border-radius:6px; font-size:11.5px;
           font-weight:700; font-family:inherit; }
  .hh-in.tem { background:rgba(59,130,246,.13); border-color:rgba(59,130,246,.4); color:#3b82f6; }
  .hh-tot { display:inline-block; min-width:46px; padding:3px 7px; border-radius:999px;
            font-weight:800; font-size:11px; background:var(--secondary); color:var(--muted-fg); }
  .hh-tot.tem { background:rgba(59,130,246,.16); color:#3b82f6; }
  .hh-del { background:none; border:none; color:var(--destructive); font-size:12px;
            cursor:pointer; opacity:.55; }
  .hh-del:hover { opacity:1; }
  .hh-table tfoot td { background:var(--secondary); font-weight:800; padding:9px 4px;
             text-align:center; font-size:12px; border-top:2px solid var(--border); }
  .hh-vazio { text-align:center; padding:40px; color:var(--muted-fg); font-style:italic; }
  /* visao "MÊS TODO": so leitura */
  .hh-lido { font-weight:700; color:var(--muted-fg); font-size:11.5px; }
  .hh-lido.tem { color:#3b82f6; }
  body.hh-leitura .action-bar .btn-primary,
  body.hh-leitura .action-bar .btn-danger { opacity:.4; pointer-events:none; }
  .hh-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }
  @media(max-width:768px){ .hh-kpis { grid-template-columns:repeat(2,1fr); } }
  /* gestao da lista de LOCAL */
  .hh-locais { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .hh-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 9px;
             border:1px solid var(--border); border-radius:999px; font-size:11px;
             font-weight:650; color:var(--fg); background:var(--secondary); }
  .hh-chip button { background:none; border:none; color:var(--muted-fg); cursor:pointer;
                    font-size:10px; font-weight:800; padding:0; line-height:1; }
  .hh-chip button:hover { color:var(--destructive); }
  .hh-novo { display:flex; gap:7px; align-items:center; margin-top:10px;
             padding-top:10px; border-top:1px dashed var(--border); }
  .hh-novo input { width:190px; text-transform:uppercase; background:transparent;
                   border:1px solid var(--border); color:var(--fg); border-radius:6px;
                   padding:6px 9px; font-size:12px; font-family:inherit; }
  .hh-novo input:focus { outline:none; border-color:var(--primary); }
</style>

<div class="page-content">
  <div class="page-header">
    <div>
      <div class="title-bar">
        <div class="title-accent"></div>
        <h1 class="page-title">🕐 Leads HxH</h1>
        <span class="saving-badge" id="saving-badge" style="display:none">💾 Salvando...</span>
        <span class="saved-badge" id="saved-badge" style="display:none">✓ Salvo</span>
      </div>
      <p class="page-subtitle" style="margin-left:20px">Leads recebidos hora a hora, por local e origem</p>
    </div>
    <div class="action-bar">
      <button class="btn btn-primary" onclick="addLinha()">+ Adicionar Linha</button>
      <button class="btn btn-outline" onclick="toggleLocais()">⚙ Locais</button>
      <button class="btn btn-outline" onclick="exportCsv()">⬇ Exportar CSV</button>
      <button class="btn btn-outline" onclick="imagemHxH()">🖼 Gerar Imagem</button>
      <button class="btn btn-danger" onclick="limparDia()">🗑 Limpar Dia</button>
    </div>
  </div>

  <div class="card" style="padding:16px">
    <div class="filter-bar">
      <div class="filter-group">
        <label class="filter-label">MÊS</label>
        <select class="select" id="sel-month" onchange="onDateChange()">
          {% set months_list = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"] %}
          {% for m in months_list %}<option value="{{ loop.index0 }}">{{ m }}</option>{% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">ANO</label>
        <select class="select" id="sel-year" onchange="onDateChange()">
          {% for y in range(2024, 2031) %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">DIA</label>
        <select class="select" id="sel-day" onchange="onDateChange()">
          {% for d in range(1, 32) %}<option value="{{ d }}">{{ '%02d' % d }}</option>{% endfor %}
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label">LOCAL</label>
        <select class="select" id="sel-local" onchange="render()">
          <option value="">Todos</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card" id="cx-locais" style="padding:16px;margin-top:10px;display:none">
    <div style="font-size:9px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
                color:var(--muted-fg);margin-bottom:9px">Locais desta tela</div>
    <div class="hh-locais" id="lista-locais"></div>
    <div class="hh-novo">
      <input type="text" id="novo-local" placeholder="novo local" maxlength="40"
             onkeydown="if(event.key==='Enter'){event.preventDefault();criaLocal();}">
      <button class="btn btn-primary" onclick="criaLocal()">+ Adicionar</button>
      <span style="font-size:9.5px;color:var(--muted-fg)">vale para todos os dias</span>
    </div>
  </div>

  <div class="hh-kpis">
    <div class="stat-card"><div class="stat-icon">📥</div><div>
      <div class="stat-value blue" id="k-mes">0</div><div class="stat-label" id="k-lbl1">Leads no mês</div></div></div>
    <div class="stat-card"><div class="stat-icon">📅</div><div>
      <div class="stat-value primary" id="k-dia">0</div><div class="stat-label" id="k-lbl2">Leads no dia</div></div></div>
    <div class="stat-card"><div class="stat-icon">⏱</div><div>
      <div class="stat-value green" id="k-pico">—</div><div class="stat-label" id="k-lbl3">Hora de pico</div></div></div>
    <div class="stat-card"><div class="stat-icon">🧾</div><div>
      <div class="stat-value" id="k-linhas">0</div><div class="stat-label" id="k-lbl4">Linhas no mês</div></div></div>
  </div>

  <div class="card table-card" style="padding:0;overflow:hidden;margin-top:14px">
    <div class="hh-wrap">
      <table class="hh-table" id="hh-table">
        <colgroup id="hh-cols"></colgroup>
        <thead><tr id="hh-head"></tr></thead>
        <tbody id="hh-body"></tbody>
        <tfoot id="hh-foot"></tfoot>
      </table>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
/* Leads hora a hora. Guarda uma linha por local x origem, com um numero por
   faixa de hora — as mesmas faixas do Hora a Hora, para os dois falarem a
   mesma lingua. O dia inteiro vai num registro so, como no Leads Recebidos. */
let linhas = [];        // [{local, nome, slots:{'08-09':n, ...}}] — do dia
let mesDados = [];      // todos os dias do mes — alimenta os indicadores
let anoDados = {};      // {mes: [dias com dados]} — pinta os seletores
let LOCAIS = [];        // [{id, nome}]
let saveTimer = null;

/* As faixas vem do /api/constants, que ja devolve TIME_SLOTS. Se a chamada
   falhar, a tela abre com estas — nao pode ficar sem coluna nenhuma. */
let FAIXAS = [
  {key:'08-09'},{key:'09-10'},{key:'10-11'},{key:'11-12'},{key:'12-13'},
  {key:'13-14'},{key:'14-15'},{key:'15-16'},{key:'16-17'},{key:'17-18'},
  {key:'18-19'},{key:'19-20'},{key:'20-21'}
];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* '08-09' vira '8h' — o cabecalho fica legivel com 13 colunas */
function rotHora(k){ return String(parseInt(String(k).slice(0,2), 10)) + 'h'; }
function num(v){ return Number(v) || 0; }
function somaLinha(l){
  return FAIXAS.reduce((s,f)=> s + num((l.slots||{})[f.key]), 0);
}

// ── Datas ───────────────────────────────────────────────────────────────────
function initDatas(){
  const now = new Date();
  document.getElementById('sel-month').value = String(now.getMonth());
  document.getElementById('sel-year').value  = String(now.getFullYear());
  updateDias(now.getDate());
}
function updateDias(prefer){
  const mi = parseInt(document.getElementById('sel-month').value);
  const y  = parseInt(document.getElementById('sel-year').value);
  const sd = document.getElementById('sel-day');
  if(isNaN(mi)||isNaN(y)) return;
  const n = new Date(y, mi+1, 0).getDate();
  const atual = sd.value;
  /* trocar de mes nao pode tirar voce do "MÊS TODO" sem avisar */
  const querTodo = (prefer === 'all') || (prefer === undefined && atual === 'all');
  const alvo = Math.min(parseInt(prefer)||parseInt(atual)||1, n) || 1;
  sd.innerHTML = '';
  const oTodo = document.createElement('option');
  oTodo.value = 'all'; oTodo.textContent = 'MÊS TODO';
  if(querTodo) oTodo.selected = true;
  sd.appendChild(oTodo);
  for(let d=1; d<=n; d++){
    const o = document.createElement('option');
    o.value = d; o.textContent = String(d).padStart(2,'0');
    if(!querTodo && d===alvo) o.selected = true;
    sd.appendChild(o);
  }
}
/* No "MÊS TODO" a tela vira so leitura: as linhas vem de dias diferentes e
   nao ha um registro unico para gravar. */
function mesTodo(){ return document.getElementById('sel-day').value === 'all'; }
function dateKey(){
  const mi = parseInt(document.getElementById('sel-month').value);
  const y  = parseInt(document.getElementById('sel-year').value);
  const d  = parseInt(document.getElementById('sel-day').value);
  if(isNaN(mi)||isNaN(y)||isNaN(d)) return null;
  return formatDateKey(y, mi, d);
}
function dateBr(){
  const k = dateKey(); if(!k) return '—';
  const p = k.split('-'); return p[2]+'/'+p[1]+'/'+p[0];
}
initDatas();

// ── Carga ───────────────────────────────────────────────────────────────────
async function onConstantsLoaded(){
  if(typeof TIME_SLOTS !== 'undefined' && TIME_SLOTS && TIME_SLOTS.length){
    FAIXAS = TIME_SLOTS;
  }
  montaCabecalho();
  await carregaLocais();
  await carregar();
  carregarAno();   // em segundo plano, nao trava a tela
}

async function carregaLocais(){
  try {
    const r = await fetch('/api/lead_opcoes?tipo=localhh');
    LOCAIS = r.ok ? await r.json() : [];
  } catch(e){ LOCAIS = []; }
  const sf = document.getElementById('sel-local');
  const atual = sf.value;
  sf.innerHTML = '<option value="">Todos</option>' +
    LOCAIS.map(l=>`<option value="${esc(l.nome)}">${esc(l.nome)}</option>`).join('');
  sf.value = atual;
  desenhaLocais();
}

function desenhaLocais(){
  document.getElementById('lista-locais').innerHTML = LOCAIS.length
    ? LOCAIS.map(l=>`<span class="hh-chip">${esc(l.nome)}` +
        `<button title="remover" onclick="apagaLocal(${l.id})">✕</button></span>`).join('')
    : '<span style="font-size:11px;color:var(--muted-fg);font-style:italic">Nenhum local cadastrado ainda.</span>';
}

function toggleLocais(){
  const c = document.getElementById('cx-locais');
  c.style.display = (c.style.display === 'none') ? '' : 'none';
}

async function criaLocal(){
  const cx = document.getElementById('novo-local');
  const nome = (cx.value||'').trim().toUpperCase();
  if(!nome) return;
  if(LOCAIS.some(l=>l.nome === nome)){
    showToast('O local "'+nome+'" já existe.','error'); return;
  }
  try {
    const r = await fetch('/api/lead_opcoes', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({tipo:'localhh', nome:nome})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'erro');
    cx.value = '';
    await carregaLocais();
    render();
    showToast('Local "'+d.nome+'" criado.');
  } catch(e){
    showToast(e.message || 'Não consegui criar o local.','error');
  }
}

async function apagaLocal(id){
  const alvo = LOCAIS.find(l=>l.id === id);
  if(!alvo) return;
  if(!confirm('Remover o local "'+alvo.nome+'"?\n\n' +
              'Ele some da lista em todos os dias. As linhas já lançadas ' +
              'continuam salvas com esse nome.')) return;
  try {
    const r = await fetch('/api/lead_opcoes/'+id, {method:'DELETE'});
    if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.error || 'erro'); }
    await carregaLocais();
    render();
    showToast('Local "'+alvo.nome+'" removido.');
  } catch(e){
    showToast(e.message || 'Não consegui remover o local.','error');
  }
}

async function carregar(){
  if(mesTodo()){
    linhas = [];
    await carregarMes();
    render();
    return;
  }
  const k = dateKey(); if(!k) return;
  const r = await fetch('/api/leads_hxh/'+k);
  if(r.status === 401){ window.location.href='/login'; return; }
  if(!r.ok){ showToast('Erro ao carregar o dia.','error'); return; }
  const d = await r.json().catch(()=>null);
  linhas = (d && Array.isArray(d.rows)) ? d.rows : [];
  linhas.forEach(l => { if(!l.slots || typeof l.slots !== 'object') l.slots = {}; });
  await carregarMes();
  render();
}
async function carregarMes(){
  const mi = parseInt(document.getElementById('sel-month').value);
  const y  = parseInt(document.getElementById('sel-year').value);
  if(isNaN(mi) || isNaN(y)){ mesDados = []; return; }
  try {
    const r = await fetch(`/api/leads_hxh_mes?ano=${y}&mes=${mi+1}`);
    mesDados = r.ok ? await r.json() : [];
  } catch(e){ mesDados = []; }
}
function onDateChange(){ updateDias(); marcarSeletores(); carregar(); }

async function carregarAno(){
  const y = parseInt(document.getElementById('sel-year').value);
  if(isNaN(y)){ anoDados = {}; return; }
  const novo = {};
  const buscas = [];
  for(let m = 1; m <= 12; m++){
    buscas.push(
      fetch(`/api/leads_hxh_mes?ano=${y}&mes=${m}`)
        .then(r => r.ok ? r.json() : [])
        .then(dias => {
          const comDados = [];
          dias.forEach(d => {
            const tem = (d.rows||[]).some(l => somaLinha(l) > 0);
            if(tem) comDados.push(parseInt(d.date.split('-')[2]));
          });
          if(comDados.length) novo[m] = comDados;
        })
        .catch(()=>{})
    );
  }
  await Promise.all(buscas);
  anoDados = novo;
  marcarSeletores();
}
function marcarSeletores(){
  const sm = document.getElementById('sel-month');
  const sd = document.getElementById('sel-day');
  const mi = parseInt(sm.value);
  [].forEach.call(sm.options, opt => {
    const temDados = !!anoDados[parseInt(opt.value) + 1];
    opt.style.backgroundColor = temDados ? 'rgba(251,191,36,0.28)' : '';
    opt.style.color           = temDados ? '#fde68a' : '';
    opt.style.fontWeight      = temDados ? '700' : '';
  });
  const dias = anoDados[mi + 1] || [];
  [].forEach.call(sd.options, opt => {
    const temDados = dias.indexOf(parseInt(opt.value)) >= 0;
    opt.style.backgroundColor = temDados ? 'rgba(251,191,36,0.28)' : '';
    opt.style.color           = temDados ? '#fde68a' : '';
    opt.style.fontWeight      = temDados ? '700' : '';
  });
}

/* As linhas que a tela mostra agora. No dia, vem de 'linhas' e trazem o indice
   para edicao. No mes todo, vem de 'mesDados' e trazem a data de cada uma. */
function visiveisAtual(){
  const filtro = document.getElementById('sel-local').value;
  const dbr = dateBr();
  if(!mesTodo()){
    return linhas.map((l,i)=>({l, i, data:dbr}))
                 .filter(x => !filtro || x.l.local === filtro);
  }
  const out = [];
  mesDados.slice()
    .sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0))
    .forEach(d => {
      const p = String(d.date).split('-');
      const br = p.length === 3 ? p[2]+'/'+p[1]+'/'+p[0] : d.date;
      (d.rows||[]).forEach(l => {
        if(filtro && l.local !== filtro) return;
        out.push({l, i:-1, data:br});
      });
    });
  return out;
}

// ── Render ──────────────────────────────────────────────────────────────────
/* O cabecalho e as larguras dependem de quantas faixas existem, entao sao
   montados uma vez, depois que as constantes chegam. */
function montaCabecalho(){
  document.getElementById('hh-cols').innerHTML =
    '<col style="width:58px"><col style="width:86px"><col style="width:78px">' +
    '<col style="width:132px"><col style="width:168px">' +
    FAIXAS.map(()=>'<col style="width:52px">').join('') +
    '<col style="width:74px"><col style="width:32px">';
  document.getElementById('hh-head').innerHTML =
    '<th>ANO</th><th>MÊS</th><th>DATA</th><th>LOCAL</th><th>NOME</th>' +
    FAIXAS.map(f=>`<th>${esc(rotHora(f.key))}</th>`).join('') +
    '<th>TOTAL</th><th></th>';
  document.querySelector('.hh-table').style.minWidth =
    (58+86+78+132+168 + FAIXAS.length*52 + 74 + 32) + 'px';
}

function render(){
  const filtro = document.getElementById('sel-local').value;
  const tb = document.getElementById('hh-body');
  const mi = parseInt(document.getElementById('sel-month').value);
  const mes = isNaN(mi) ? '—' : MONTHS[mi];
  const ano = document.getElementById('sel-year').value;
  const nCols = 5 + FAIXAS.length + 2;
  const todo = mesTodo();

  const vis = visiveisAtual();
  document.body.classList.toggle('hh-leitura', todo);

  if(!vis.length){
    tb.innerHTML = todo
      ? `<tr><td colspan="${nCols}" class="hh-vazio">Nenhum lançamento neste mês.</td></tr>`
      : `<tr><td colspan="${nCols}" class="hh-vazio">
      Nenhuma linha neste dia.
      <div style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap">
        <button type="button" onclick="repetirLinhas()"
          style="padding:8px 15px;border-radius:8px;cursor:pointer;border:none;font-family:inherit;
                 font-size:12px;font-weight:700;background:var(--primary);color:#1a1a1a">
          ⟳ Repetir locais e nomes do último dia
        </button>
        <span style="font-size:11.5px;color:var(--muted-fg)">ou clique em <b>+ Adicionar Linha</b></span>
      </div></td></tr>`;
    document.getElementById('hh-foot').innerHTML = '';
  } else {
    const nomesLocais = LOCAIS.map(l=>l.nome);
    tb.innerHTML = vis.map(({l,i,data},pos)=>{
      const t = somaLinha(l);
      const cels = FAIXAS.map(f=>{
        const v = num((l.slots||{})[f.key]);
        if(todo) return `<td class="${v>0?'hh-lido tem':'hh-lido'}">${v||''}</td>`;
        return `<td><input class="hh-in ${v>0?'tem':''}" inputmode="numeric" maxlength="6"
          value="${v||''}" oninput="setHora(${i},'${f.key}',this.value)"/></td>`;
      }).join('');

      /* No mes todo nao ha o que editar: as celulas viram texto. */
      let celLocal, celNome, celAcao;
      if(todo){
        celLocal = `<td class="hh-lido">${esc(l.local)}</td>`;
        celNome  = `<td class="hh-lido" style="text-align:left">${esc(l.nome)}</td>`;
        celAcao  = '<td></td>';
      } else {
        /* local salvo que nao esta mais na lista continua aparecendo: o numero
           nao pode mudar de dono so porque alguem apagou o local */
        const opts = nomesLocais.concat(
          (l.local && nomesLocais.indexOf(l.local) < 0) ? [l.local] : []);
        const locOpts = opts.map(x=>`<option${x===l.local?' selected':''}>${esc(x)}</option>`).join('');
        celLocal = `<td><select class="hh-dd" onchange="setVal(${i},'local',this.value)">${locOpts}</select></td>`;
        celNome  = `<td><input class="hh-nm" maxlength="60" value="${esc(l.nome)}"
             placeholder="origem — ex.: VBOT" oninput="setVal(${i},'nome',this.value)"/></td>`;
        celAcao  = `<td><button class="hh-del" onclick="rmLinha(${i})" title="Remover linha">🗑</button></td>`;
      }
      return `<tr class="${pos%2?'alt':''}">
        <td class="hh-fx">${ano}</td><td class="hh-fx">${mes}</td><td class="hh-fx">${esc(data)}</td>
        ${celLocal}${celNome}${cels}
        <td><span class="hh-tot ${t>0?'tem':''}"${todo?'':` id="tot-${i}"`}>${t}</span></td>
        ${celAcao}
      </tr>`;
    }).join('');

    const porHora = FAIXAS.map(f => vis.reduce((s,x)=> s + num((x.l.slots||{})[f.key]), 0));
    const tGeral = porHora.reduce((a,b)=>a+b,0);
    const rot = todo ? `TOTAL DO MÊS — ${vis.length} linha(s)` : `TOTAL — ${vis.length} linha(s)`;
    document.getElementById('hh-foot').innerHTML = `<tr>
      <td colspan="5" style="text-align:left;padding-left:12px;color:var(--muted-fg)">${rot}</td>
      ${porHora.map(v=>`<td style="color:${v>0?'#3b82f6':'var(--muted-fg)'}">${v}</td>`).join('')}
      <td style="color:#3b82f6">${tGeral}</td><td></td></tr>`;
  }

  atualizaKpis(filtro, mes);
}

/* Indicadores do topo: mes inteiro, respeitando o filtro de LOCAL. */
function atualizaKpis(filtro, mes){
  let TM = 0, nLin = 0;
  const porHora = {};
  mesDados.forEach(d => (d.rows||[]).forEach(l => {
    if(filtro && l.local !== filtro) return;
    nLin++;
    FAIXAS.forEach(f => {
      const v = num((l.slots||{})[f.key]);
      if(v){ TM += v; porHora[f.key] = (porHora[f.key]||0) + v; }
    });
  }));
  const todo = mesTodo();
  let TD = 0, nDias = 0;
  if(todo){
    mesDados.forEach(d => {
      const tem = (d.rows||[]).some(l => (!filtro || l.local === filtro) && somaLinha(l) > 0);
      if(tem) nDias++;
    });
    TD = nDias;
  } else {
    linhas.forEach(l => { if(!filtro || l.local === filtro) TD += somaLinha(l); });
  }

  let pico = '—', maior = 0;
  Object.keys(porHora).forEach(k => { if(porHora[k] > maior){ maior = porHora[k]; pico = rotHora(k); } });

  document.getElementById('k-mes').textContent    = TM;
  document.getElementById('k-dia').textContent    = TD;
  document.getElementById('k-pico').textContent   = pico;
  document.getElementById('k-linhas').textContent = nLin;
  const sufixo = ' no mês de ' + mes + (filtro ? ' · ' + filtro : '');
  document.getElementById('k-lbl1').textContent = 'Leads' + sufixo;
  document.getElementById('k-lbl2').textContent = todo
    ? 'Dias com lançamento' + sufixo
    : 'Leads no dia ' + dateBr() + (filtro ? ' · ' + filtro : '');
  document.getElementById('k-lbl3').textContent = 'Hora de pico' + sufixo + (maior ? ' (' + maior + ')' : '');
  document.getElementById('k-lbl4').textContent = 'Linhas' + sufixo;
}

// ── Edição ──────────────────────────────────────────────────────────────────
/* Repintar a tabela inteira a cada tecla tirava o cursor da celula. Entao a
   digitacao so mexe no total daquela linha, no rodape e nos indicadores. */
function setHora(i, key, v){
  if(mesTodo() || !linhas[i]) return;
  if(!linhas[i].slots) linhas[i].slots = {};
  linhas[i].slots[key] = num(v);
  atualizaLinha(i);
  agendarSave();
}
function atualizaLinha(i){
  const sp = document.getElementById('tot-'+i);
  if(sp){
    const t = somaLinha(linhas[i]);
    sp.textContent = t;
    sp.className = 'hh-tot' + (t > 0 ? ' tem' : '');
  }
  const filtro = document.getElementById('sel-local').value;
  const mi = parseInt(document.getElementById('sel-month').value);
  const vis = linhas.filter(l => !filtro || l.local === filtro);
  const porHora = FAIXAS.map(f => vis.reduce((s,l)=> s + num((l.slots||{})[f.key]), 0));
  const tGeral = porHora.reduce((a,b)=>a+b,0);
  const foot = document.getElementById('hh-foot');
  if(foot && foot.innerHTML){
    foot.innerHTML = `<tr>
      <td colspan="5" style="text-align:left;padding-left:12px;color:var(--muted-fg)">TOTAL — ${vis.length} linha(s)</td>
      ${porHora.map(v=>`<td style="color:${v>0?'#3b82f6':'var(--muted-fg)'}">${v}</td>`).join('')}
      <td style="color:#3b82f6">${tGeral}</td><td></td></tr>`;
  }
  atualizaKpis(filtro, isNaN(mi) ? '—' : MONTHS[mi]);
}
function setVal(i,k,v){
  if(mesTodo() || !linhas[i]) return;
  linhas[i][k] = v;
  if(k === 'local') render();      // o filtro pode escondê-la
  else atualizaLinha(i);
  agendarSave();
}
/* Anda para tras dia a dia, ate 14 dias, e para no primeiro que tiver linha.
   Copia so o local e o nome; as horas entram zeradas. Mesmo comportamento do
   "Repetir equipe" do Hora a Hora. */
async function repetirLinhas(){
  if(mesTodo()){ showToast('Escolha um dia primeiro.','error'); return; }
  const mi = parseInt(document.getElementById('sel-month').value);
  const y  = parseInt(document.getElementById('sel-year').value);
  const d  = parseInt(document.getElementById('sel-day').value);
  if(isNaN(mi) || isNaN(y) || isNaN(d)){
    showToast('Selecione uma data válida primeiro.','error'); return;
  }
  const base = new Date(y, mi, d);
  showToast('Procurando o último dia com lançamento...');

  for(let k = 1; k <= 14; k++){
    const dt = new Date(base.getTime());
    dt.setDate(dt.getDate() - k);
    const chave = dt.getFullYear() + '-' +
                  String(dt.getMonth()+1).padStart(2,'0') + '-' +
                  String(dt.getDate()).padStart(2,'0');
    let dados = null;
    try{
      const r = await fetch('/api/leads_hxh/' + chave);
      if(r.ok) dados = await r.json().catch(()=>null);
    }catch(e){}
    const antigas = (dados && Array.isArray(dados.rows)) ? dados.rows : [];
    /* linha so conta se tiver local ou nome — linha em branco nao vale viagem */
    const uteis = antigas.filter(l => l && ((l.local||'').trim() || (l.nome||'').trim()));
    if(!uteis.length) continue;

    linhas = uteis.map(l => ({local: l.local || '', nome: l.nome || '', slots: {}}));
    render(); agendarSave();
    const br = String(dt.getDate()).padStart(2,'0') + '/' +
               String(dt.getMonth()+1).padStart(2,'0');
    showToast(uteis.length + ' linha(s) copiada(s) de ' + br, 'success');
    return;
  }
  showToast('Nenhum lançamento encontrado nos 14 dias anteriores.','error');
}

function addLinha(){
  if(mesTodo()){ showToast('Escolha um dia para lançar.','error'); return; }
  if(!LOCAIS.length){
    showToast('Cadastre um local primeiro, no botão ⚙ Locais.','error'); return;
  }
  const filtro = document.getElementById('sel-local').value;
  linhas.push({local: filtro || LOCAIS[0].nome, nome:'', slots:{}});
  render(); agendarSave();
}
function rmLinha(i){
  if(mesTodo()) return;
  linhas.splice(i,1); render(); agendarSave();
}
function limparDia(){
  if(mesTodo()){ showToast('Escolha um dia para limpar.','error'); return; }
  if(!linhas.length){ showToast('Não há nada para limpar.','error'); return; }
  if(!confirm('Apagar todas as linhas deste dia?')) return;
  linhas = []; render(); agendarSave();
  showToast('Dia limpo.');
}

// ── Salvamento ──────────────────────────────────────────────────────────────
function agendarSave(){
  if(mesTodo()) return;          // visao de leitura: nao ha dia para gravar
  clearTimeout(saveTimer);
  document.getElementById('saving-badge').style.display = '';
  document.getElementById('saved-badge').style.display = 'none';
  saveTimer = setTimeout(salvar, 1200);
}
async function salvar(){
  const k = dateKey(); if(!k) return;
  const r = await fetch('/api/leads_hxh/'+k, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({rows: linhas})
  });
  document.getElementById('saving-badge').style.display = 'none';
  if(r.ok){
    document.getElementById('saved-badge').style.display = '';
    await carregarMes();
    render();
    carregarAno();
  } else {
    const e = await r.json().catch(()=>({}));
    showToast('Erro ao salvar: ' + (e.error || r.status), 'error');
  }
}

// ── CSV ─────────────────────────────────────────────────────────────────────
function exportCsv(){
  const vis = visiveisAtual();
  if(!vis.length){ showToast('Não há linhas para exportar.','error'); return; }
  const mi = parseInt(document.getElementById('sel-month').value);
  const mes = isNaN(mi) ? '' : MONTHS[mi];
  const ano = document.getElementById('sel-year').value;
  const head = ['ANO','MÊS','DATA','LOCAL','NOME']
    .concat(FAIXAS.map(f=>rotHora(f.key))).concat(['TOTAL']);
  const q = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const L = [head.map(q).join(';')];
  vis.forEach(({l,data}) => {
    L.push([ano, mes, data, l.local, l.nome]
      .concat(FAIXAS.map(f=>num((l.slots||{})[f.key])))
      .concat([somaLinha(l)]).map(q).join(';'));
  });
  const blob = new Blob(['﻿'+L.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = mesTodo()
    ? 'leads_hxh_' + ano + '-' + String(mi+1).padStart(2,'0') + '_mes.csv'
    : 'leads_hxh_' + dateKey() + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}
/* ── Imagem do Leads HxH ───────────────────────────────────────────────────
   Mesma linguagem visual do Fechamento. Tudo fica dentro deste IIFE: a tela
   so enxerga window.imagemHxH. */
(function(){
  var C = {
    papel:'#fffffd', faixa:'#15171b', painel:'#f6f5f2', borda:'#e4e2dc',
    tinta:'#111113', corpo:'#48484e', fraco:'#92929a', claro:'#c4c4cc',
    ouro:'#bf9620', ouroE:'#967516', fio:'#eae8e2'
  };
  var IM = 54, IR = 1240 - 54;
  var CX_LEADS = IR - 150, CX_PCT = IR;
  var H_UNI = 24, H_CAN = 21, H_TOT = 25;
  var CX_COLS = 3, CX_GAP = 10, CX_ALT = 58;
  var TOTAL_GERAL = 0;

  function fnt(p,t){ return p + ' ' + t + 'px Lato, Inter, sans-serif'; }
  function n(v){ return (Number(v)||0).toLocaleString('pt-BR'); }
  function pc(v,t){ return t>0 ? (v/t*100).toFixed(1).replace('.',',')+'%' : '0%'; }

  function T(ct,x,y,s,f,cor,dir){
    ct.font=f; ct.fillStyle=cor||C.tinta; ct.textBaseline='top';
    var w=ct.measureText(s).width;
    if(dir==='r') x-=w; else if(dir==='c') x-=w/2;
    ct.fillText(s,x,y); return w;
  }
  /* corta o texto que nao cabe na largura dada */
  function TCORTA(ct,x,y,s,f,cor,max){
    ct.font=f;
    while(s.length>3 && ct.measureText(s).width>max) s=s.slice(0,-1);
    if(ct.measureText(s).width>max) s=s.slice(0,3);
    return T(ct,x,y,s,f,cor);
  }
  function CAP(ct,x,y,s,f,cor,esp,dir){
    ct.font=f; ct.fillStyle=cor||C.fraco; ct.textBaseline='top';
    esp=(esp===undefined)?2.4:esp;
    var larg=0,i;
    for(i=0;i<s.length;i++) larg+=ct.measureText(s[i]).width+esp;
    larg-=esp;
    if(dir==='r') x-=larg; else if(dir==='c') x-=larg/2;
    for(i=0;i<s.length;i++){ ct.fillText(s[i],x,y); x+=ct.measureText(s[i]).width+esp; }
    return larg;
  }
  function RET(ct,x,y,w,h,cor){ ct.fillStyle=cor; ct.fillRect(x,y,w,h); }
  function BORDA(ct,x,y,w,h,cor){
    ct.strokeStyle=cor; ct.lineWidth=1; ct.strokeRect(x+0.5,y+0.5,w-1,h-1);
  }
  function LIN(ct,x0,y0,x1,cor,larg){
    ct.strokeStyle=cor; ct.lineWidth=larg||1;
    ct.beginPath(); ct.moveTo(x0,y0+0.5); ct.lineTo(x1,y0+0.5); ct.stroke();
  }
  function SECAO(ct,y,rotulo){
    RET(ct,IM,y,7,26,C.ouro);
    CAP(ct,IM+20,y+4,rotulo,fnt(700,18),C.tinta,2.8);
    return y+35;
  }

  /* A logo tem margem transparente em volta: medimos a area pintada para
     centralizar o desenho, e nao a moldura do arquivo. */
  var _logo=null,_corte=null,_tentou=false;
  function carregaLogo(cb){
    if(_logo || _tentou){ cb(); return; }
    var im=new Image();
    im.onload=function(){
      _logo=im; _tentou=true;
      try{
        var c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
        var x=c.getContext('2d'); x.drawImage(im,0,0);
        var d=x.getImageData(0,0,im.width,im.height).data;
        var x0=im.width,y0=im.height,x1=-1,y1=-1;
        for(var py=0;py<im.height;py++) for(var px=0;px<im.width;px++)
          if(d[(py*im.width+px)*4+3]>8){
            if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py; }
        if(x1>x0&&y1>y0) _corte={x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
      }catch(e){ _corte=null; }
      cb();
    };
    im.onerror=function(){ _tentou=true; cb(); };
    im.src='/static/logo.png';
  }

  /* ── agregacao: por unidade (local) e por fonte (nome) ── */
  function agrega(){
    var mapa={}, fonte={}, total=0;
    visiveisAtual().forEach(function(x){
      var t = somaLinha(x.l);
      if(t<=0) return;                       // linha zerada nao vira caixinha
      var u = String(x.l.local || '—').trim() || '—';
      var f = String(x.l.nome  || '—').trim() || '—';
      if(!mapa[u]) mapa[u]={nome:u, total:0, canais:{}};
      mapa[u].canais[f]=(mapa[u].canais[f]||0)+t;
      mapa[u].total+=t;
      fonte[f]=(fonte[f]||0)+t;
      total+=t;
    });
    var unis=Object.keys(mapa).map(function(k){
      var u=mapa[k];
      u.lista=Object.keys(u.canais).map(function(c){ return {nome:c, v:u.canais[c]}; })
               .sort(function(a,b){ return b.v-a.v; });
      return u;
    }).sort(function(a,b){ return b.total-a.total; });
    var fontes=Object.keys(fonte).map(function(k){ return {nome:k, v:fonte[k]}; })
                .sort(function(a,b){ return b.v-a.v; });
    return {unis:unis, fontes:fontes, total:total};
  }

  function alturaCaixas(qtd){
    return Math.ceil(qtd / CX_COLS) * (CX_ALT + CX_GAP);
  }
  /* grade de caixinhas, no mesmo formato do "Agendamentos por unidade" */
  function caixas(ct, y, itens){
    var larg = (IR - IM - (CX_COLS-1)*CX_GAP) / CX_COLS;
    itens.forEach(function(it, i){
      var cx = IM + (i % CX_COLS) * (larg + CX_GAP);
      var cy = y + Math.floor(i / CX_COLS) * (CX_ALT + CX_GAP);
      RET(ct, cx, cy, larg, CX_ALT, C.painel);
      BORDA(ct, cx, cy, larg, CX_ALT, C.borda);
      TCORTA(ct, cx+12, cy+10, it.nome, fnt(700,12.5), C.tinta, larg-80);
      T(ct, cx+12, cy+27, n(it.v), fnt(800,24), C.tinta);
      T(ct, cx+larg-12, cy+34, pc(it.v, TOTAL_GERAL), fnt(600,11), C.fraco, 'r');
    });
    return y + alturaCaixas(itens.length) + 12;
  }
  function cabecalhoTabela(ct, y, rotulo){
    CAP(ct, IM+6,     y, rotulo,  fnt(700,10), C.fraco, 1.8);
    CAP(ct, CX_LEADS, y, 'LEADS', fnt(700,10), C.fraco, 1.8, 'r');
    CAP(ct, CX_PCT,   y, '%',     fnt(700,10), C.fraco, 1.8, 'r');
    LIN(ct, IM, y+16, IR, C.borda, 1);
    return y+22;
  }

  function desenha(){
    var d = agrega();
    TOTAL_GERAL = d.total;

    var todo    = mesTodo();
    var mi      = parseInt(document.getElementById('sel-month').value, 10);
    var ano     = document.getElementById('sel-year').value;
    var mes     = isNaN(mi) ? '—' : MONTHS[mi];
    var carimbo = todo ? (mes + '/' + ano) : dateBr();
    var periodo = (todo ? 'Leads recebidos no mês' : 'Leads recebidos no dia')
                  + ' · ' + carimbo;

    var alt = 153 + 26;
    alt += 35 + alturaCaixas(d.unis.length) + 12;   // caixas por unidade
    alt += 35 + 22;                                  // secao + cabecalho tabela
    d.unis.forEach(function(u){ alt += H_UNI + u.lista.length*H_CAN + H_TOT; });
    alt += H_TOT + 56;

    var cv = document.createElement('canvas');
    cv.width = 1240; cv.height = alt;
    var ct = cv.getContext('2d');
    RET(ct,0,0,1240,alt,C.papel);

    /* faixa escura do topo */
    RET(ct,0,0,1240,150,C.faixa);
    if(_logo && _corte){
      var h=54, w=_corte.w*(h/_corte.h);
      ct.drawImage(_logo,_corte.x,_corte.y,_corte.w,_corte.h, 620-w/2, 26, w, h);
    } else {
      CAP(ct,620,36,'CONNECTING',fnt(800,22),'#fbbf24',5,'c');
    }
    CAP(ct,620,92,'LEADS HORA A HORA',fnt(800,17),'#fffffd',4.2,'c');
    T(ct,620,118,periodo,fnt(400,12.5),'#8e8e96','c');
    RET(ct,0,150,1240,3,C.ouro);

    var y = 150 + 26;

    /* caixinhas por unidade */
    y = SECAO(ct, y, 'LEADS POR UNIDADE');
    y = caixas(ct, y, d.unis.map(function(u){ return {nome:u.nome, v:u.total}; }));

    /* detalhamento: unidade e fonte */
    y = SECAO(ct, y, 'DETALHAMENTO POR UNIDADE E FONTE');
    y = cabecalhoTabela(ct, y, 'UNIDADE E FONTE');
    d.unis.forEach(function(u){
      T(ct, IM+6, y+5, u.nome, fnt(700,14), C.tinta);
      y += H_UNI;
      u.lista.forEach(function(c, i){
        if(i%2) RET(ct, IM, y, IR-IM, H_CAN, '#faf9f6');
        T(ct, IM+24, y+4, c.nome,            fnt(400,12.5), C.corpo);
        T(ct, CX_LEADS, y+3, n(c.v),         fnt(600,13),   C.tinta, 'r');
        T(ct, CX_PCT,   y+4, pc(c.v,d.total),fnt(400,11.5), C.fraco, 'r');
        y += H_CAN;
      });
      LIN(ct, IM+24, y, IR, C.fio, 1);
      T(ct, IM+24, y+5, 'Total',                 fnt(700,12.5),  C.corpo);
      T(ct, CX_LEADS, y+4, n(u.total),           fnt(800,13.5),  C.tinta, 'r');
      T(ct, CX_PCT,   y+5, pc(u.total,d.total),  fnt(700,11.5),  C.ouroE, 'r');
      y += H_TOT;
    });
    LIN(ct, IM, y, IR, C.ouro, 2);
    RET(ct, IM, y+2, IR-IM, H_TOT-2, '#f3f1ea');
    T(ct, IM+6, y+7, 'Total geral', fnt(800,13.5), C.tinta);
    T(ct, CX_LEADS, y+6, n(d.total), fnt(800,15), C.ouroE, 'r');
    T(ct, CX_PCT,   y+7, '100%',     fnt(700,12), C.ouroE, 'r');

    LIN(ct,IM,alt-40,IR,C.fio,1);
    T(ct,IM,alt-30,'Connecting · Sistema de Agendamentos',fnt(400,11),C.claro);
    T(ct,IR,alt-30,carimbo,fnt(400,11),C.claro,'r');

    var arq = todo
      ? ('leads_hxh_' + ano + '-' + String(isNaN(mi)?0:mi+1).padStart(2,'0') + '_mes.png')
      : ('leads_hxh_' + (dateKey() || 'dia') + '.png');
    var a = document.createElement('a');
    a.download = arq;
    a.href = cv.toDataURL('image/png');
    a.click();
    showToast('Imagem gerada: ' + arq);
  }

  window.imagemHxH = function(){
    var d = agrega();
    if(!d.total){ showToast('Não há leads para gerar a imagem.','error'); return; }
    carregaLogo(desenha);
  };
})();
// Se o base.html não disparar, inicializa mesmo assim
if(typeof formatDateKey === 'function'){
  setTimeout(() => { if(!document.getElementById('hh-body').innerHTML) onConstantsLoaded(); }, 900);
}
</script>
