{% extends "base.html" %}
{% block content %}
<style>/*MULTI-UNIT*/.emp-card-multi{align-items:flex-start}.emp-units{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.emp-unit-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fbbf24;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}.emp-unit-x{background:none;border:none;color:#f87171;cursor:pointer;font-size:11px;line-height:1;padding:0}.emp-addunit{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.4);color:#3d82f6;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;align-self:center}</style>
<script>(function(){function coConfirm(msg,onOk){var ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;display:flex;align-items:center;justify-content:center";ov.innerHTML='<div style="background:#141414;border:1px solid rgba(251,191,36,.35);border-radius:14px;padding:22px 20px;min-width:280px;max-width:360px;box-shadow:0 12px 44px rgba(0,0,0,.6)"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="width:26px;height:26px;border-radius:50%;background:rgba(251,191,36,.15);color:#fbbf24;display:inline-flex;align-items:center;justify-content:center;font-weight:800">!</span><span style="color:#fbbf24;font-weight:700;font-size:14px;letter-spacing:.5px">CONNECTING</span></div><div style="color:#eef1f7;font-size:13.5px;line-height:1.5;margin-bottom:20px">'+msg+'</div><div style="display:flex;gap:8px;justify-content:flex-end"><button data-cancel="1" style="background:#222;border:1px solid #333;color:#cbd5e1;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">Cancelar</button><button data-ok="1" style="background:#fbbf24;border:none;color:#18181b;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700">Remover</button></div></div>';ov.addEventListener("click",function(ev){var t=ev.target;if(t===ov||t.getAttribute("data-cancel")){ov.remove();return;}if(t.getAttribute("data-ok")){ov.remove();onOk();}});document.body.appendChild(ov);}function renderGrouped(){var grid=document.getElementById("emp-grid"); if(!grid) return;var fuEl=document.getElementById("filter-unit"); var fUnit=fuEl?fuEl.value:"ALL";var all=(typeof allEmployees!=="undefined"&&allEmployees)?allEmployees:[];var map={}; all.forEach(function(e){ (map[e.name]=map[e.name]||[]).push(e); });var names=Object.keys(map);if(fUnit!=="ALL") names=names.filter(function(n){ return map[n].some(function(e){return e.unit===fUnit;}); });if(!names.length){ grid.innerHTML="<div class=\"empty-state\"><p>Nenhum funcionario encontrado.</p></div>"; return; }grid.innerHTML=names.sort().map(function(n){var rows=map[n];var badges=rows.map(function(e){ return "<span class=\"emp-unit-badge\">&#127970; "+e.unit+" <button class=\"emp-unit-x\" title=\"Remover unidade\" onclick=\"removeUnitRow("+e.id+")\">&#10005;</button></span>"; }).join("");var av=(n[0]||"?").toUpperCase();var nameAttr=n.split("\"").join("&quot;");return "<div class=\"emp-card emp-card-multi\"><div class=\"emp-avatar\">"+av+"</div><div class=\"emp-info\"><div class=\"emp-name\">"+n+"</div><div class=\"emp-units\">"+badges+"</div></div><button class=\"emp-addunit\" data-name=\""+nameAttr+"\" onclick=\"openAddUnit(this)\">+ unidade</button></div>";}).join("");}window.openAddUnit=function(btn){var name=btn.getAttribute("data-name")||"";var units=(typeof UNITS!=="undefined")?UNITS:[];var has=(allEmployees||[]).filter(function(e){return e.name===name;}).map(function(e){return e.unit;});var avail=units.filter(function(u){return has.indexOf(u)<0;});if(!avail.length){ showToast("Ja esta em todas as unidades.","error"); return; }var ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center";ov.innerHTML="<div style=\"background:#141414;border:1px solid #333;border-radius:12px;padding:18px;min-width:260px\"><div style=\"color:#fbbf24;font-weight:600;margin-bottom:12px\">Adicionar unidade a "+name+"</div><div style=\"display:flex;flex-direction:column;gap:8px\">"+avail.map(function(u){return "<button class=\"btn\" style=\"width:100%\" data-u=\""+u+"\">&#127970; "+u+"</button>";}).join("")+"</div><button class=\"btn\" style=\"margin-top:12px;width:100%\" data-cancel=\"1\">Cancelar</button></div>";ov.addEventListener("click",function(ev){ var t=ev.target; if(t===ov||t.getAttribute("data-cancel")){ ov.remove(); return; } var u=t.getAttribute("data-u"); if(u){ t.disabled=true; fetch("/api/employees",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name,unit:u,active:true})}).then(function(){ ov.remove(); loadEmployees(); showToast("Unidade adicionada!"); }); } });document.body.appendChild(ov);};window.removeUnitRow=function(id){var e=(allEmployees||[]).find(function(x){return x.id===id;});var name=e?e.name:""; var cnt=(allEmployees||[]).filter(function(x){return x.name===name;}).length;var msg=cnt<=1?("Remover o funcionario "+name+"?"):("Remover a unidade "+(e?e.unit:"")+" de "+name+"?");coConfirm(msg,function(){ fetch("/api/employees/"+id+"?hard=true",{method:"DELETE"}).then(function(){ loadEmployees(); showToast("Removido!"); }); });};function install(){if(typeof loadEmployees!=="function"){ return setTimeout(install,120); }window.filterEmployees=renderGrouped;window.renderEmployees=function(){ renderGrouped(); };loadEmployees();}if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",function(){ setTimeout(install,300); }); } else { setTimeout(install,300); }})();</script>
<div class="page-content">
  <div class="page-header">
    <div>
      <div class="title-bar">
        <div class="title-accent"></div>
        <h1 class="page-title">Funcionários</h1>
      </div>
      <p class="page-subtitle" style="margin-left:20px">Gerencie a equipe de cada unidade</p>
    </div>
    <div class="filter-bar">
      <select class="select" id="filter-unit" onchange="filterEmployees()">
        <option value="ALL">Todas unidades</option>
      </select>
      <button class="btn btn-primary" onclick="openAddModal()">+ Adicionar</button>
    </div>
  </div>

  <div class="emp-grid" id="emp-grid">
    <div class="loading">Carregando...</div>
  </div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="modal-add" onclick="closeAddModal()">
  <div class="modal" style="max-width:360px" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>👤 Novo Funcionário</span>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="filter-group" style="margin-bottom:12px">
        <label class="filter-label">NOME</label>
        <input class="input" id="new-name" placeholder="Nome completo" style="width:100%"
          onkeydown="if(event.key==='Enter')addEmployee()"/>
      </div>
      <div class="filter-group" style="margin-bottom:16px">
        <label class="filter-label">UNIDADE</label>
        <select class="select" id="new-unit" style="width:100%"></select>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-outline" onclick="closeAddModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="addEmployee()">Adicionar</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allEmployees = [];

function onConstantsLoaded() {
  // Populate unit filters
  const filterUnit = document.getElementById('filter-unit');
  const newUnit = document.getElementById('new-unit');
  UNITS.forEach(u=>{
    const o1=document.createElement('option'); o1.value=u; o1.textContent=u; filterUnit.appendChild(o1);
    const o2=document.createElement('option'); o2.value=u; o2.textContent=u; newUnit.appendChild(o2);
  });
  loadEmployees();
}

async function loadEmployees() {
  const res = await fetch('/api/employees');
  allEmployees = await res.json();
  filterEmployees();
}

function filterEmployees() {
  const unit = document.getElementById('filter-unit').value;
  const list = unit==='ALL' ? allEmployees : allEmployees.filter(e=>e.unit===unit);
  renderEmployees(list);
}

function renderEmployees(list) {
  const grid = document.getElementById('emp-grid');
  if(list.length===0){
    grid.innerHTML='<div class="empty-state"><p>Nenhum funcionário encontrado.</p></div>';
    return;
  }
  grid.innerHTML=list.map(emp=>`
    <div class="emp-card">
      <div class="emp-avatar">${emp.name[0]?.toUpperCase()||'?'}</div>
      <div class="emp-info">
        <div class="emp-name">${emp.name}</div>
        <div class="emp-unit">🏢 ${emp.unit}</div>
      </div>
      <button class="del-btn emp-del" onclick="deleteEmployee(${emp.id})">🗑</button>
    </div>`
  ).join('');
}

function openAddModal() { document.getElementById('modal-add').classList.add('show'); document.getElementById('new-name').focus(); }
function closeAddModal() { document.getElementById('modal-add').classList.remove('show'); document.getElementById('new-name').value=''; }

async function addEmployee() {
  const name=document.getElementById('new-name').value.trim();
  const unit=document.getElementById('new-unit').value;
  if(!name){ showToast('Digite um nome.','error'); return; }
  await fetch('/api/employees',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,unit,active:true})
  });
  closeAddModal();
  await loadEmployees();
  showToast('Funcionário adicionado!');
}

async function deleteEmployee(id) {
  if(!confirm('Remover este funcionário?')) return;
  await fetch(`/api/employees/${id}`,{method:'DELETE'});
  await loadEmployees();
  showToast('Funcionário removido.');
}
</script>
{% endblock %}
