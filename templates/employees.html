{% extends "base.html" %}
{% block content %}
<style>
  /* ══════════ FUNCIONÁRIOS — lista única ══════════ */
  .fn-page{ font-size:13px }

  .fn-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap }
  .fn-search{ position:relative }
  .fn-search svg{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; stroke-width:1.7; color:var(--muted-fg); pointer-events:none;
  }
  .fn-input{
    background:var(--secondary); border:1px solid var(--border); color:var(--fg);
    border-radius:8px; height:34px; padding:0 12px 0 31px; font-size:12.5px;
    outline:none; width:210px; font-family:inherit;
    transition:border-color .15s, box-shadow .15s;
  }
  .fn-input::placeholder{ color:var(--muted-fg) }
  .fn-input:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(251,191,36,.08) }
  .fn-select{
    background:var(--secondary); border:1px solid var(--border); color:var(--fg);
    border-radius:8px; height:34px; padding:0 10px; font-size:12.5px;
    outline:none; cursor:pointer; font-family:inherit;
  }
  .fn-select:focus{ border-color:var(--primary) }
  .fn-add{
    height:34px; padding:0 14px; border:none; border-radius:8px; cursor:pointer;
    background:var(--primary); color:var(--primary-fg); font-size:12.5px; font-weight:600;
    font-family:inherit; display:inline-flex; align-items:center; gap:6px;
    transition:filter .15s;
  }
  .fn-add svg{ width:14px; height:14px; stroke-width:2.2 }
  .fn-add:hover{ filter:brightness(1.08) }

  .fn-wrap{
    background:var(--card); border:1px solid var(--border);
    border-radius:12px; overflow:hidden;
  }
  .fn-tbl{ width:100%; border-collapse:collapse }
  .fn-tbl thead th{
    font-size:9.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
    color:var(--muted-fg); text-align:left; padding:11px 16px; white-space:nowrap;
    border-bottom:1px solid var(--border); background:rgba(255,255,255,.015);
    position:sticky; top:0; z-index:2;
  }
  body.tema-claro .fn-tbl thead th{ background:rgba(0,0,0,.015) }
  .fn-tbl thead th.ord{ cursor:pointer; user-select:none; transition:color .14s }
  .fn-tbl thead th.ord:hover{ color:var(--fg) }
  .fn-seta{ opacity:.9; margin-left:3px }

  .fn-tbl tbody td{
    padding:9px 16px; border-bottom:1px solid rgba(255,255,255,.045);
    vertical-align:middle;
  }
  body.tema-claro .fn-tbl tbody td{ border-bottom-color:rgba(0,0,0,.05) }
  .fn-tbl tbody tr:last-child td{ border-bottom:none }
  .fn-tbl tbody tr{ transition:background .13s }
  .fn-tbl tbody tr:hover{ background:rgba(255,255,255,.022) }
  body.tema-claro .fn-tbl tbody tr:hover{ background:rgba(0,0,0,.022) }

  .fn-nome-cel{ display:flex; align-items:center; gap:10px; min-width:0 }
  .fn-av{
    width:26px; height:26px; border-radius:7px; flex:0 0 auto;
    display:grid; place-items:center; font-size:11px; font-weight:650;
    background:var(--secondary); color:var(--muted-fg);
  }
  .fn-av.lider{ background:rgba(251,191,36,.12); color:var(--primary) }
  .fn-nome{
    font-size:13px; font-weight:500; color:var(--fg); letter-spacing:-.005em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fn-func{
    display:inline-block; font-size:9.5px; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; padding:2.5px 8px; border-radius:5px;
    background:var(--secondary); color:var(--muted-fg); white-space:nowrap;
  }
  .fn-func.lider{ background:rgba(251,191,36,.1); color:var(--primary) }
  .fn-princ{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--fg) }
  .fn-princ i{
    width:5px; height:5px; border-radius:50%; background:var(--primary);
    display:block; flex:0 0 auto;
  }
  .fn-chips{ display:flex; flex-wrap:wrap; gap:4px }
  .fn-chip{
    display:inline-flex; align-items:center; gap:4px;
    font-size:10px; font-weight:500; color:var(--muted-fg);
    background:var(--secondary); border:1px solid var(--border);
    padding:1.5px 4px 1.5px 6px; border-radius:5px; white-space:nowrap; line-height:1.5;
  }
  .fn-chip-x{
    border:none; background:transparent; color:var(--muted-fg); cursor:pointer;
    font-size:9px; line-height:1; padding:1px 2px; border-radius:3px; transition:all .13s;
  }
  .fn-chip-x:hover{ background:rgba(239,68,68,.18); color:#f87171 }
  .fn-vazio{ color:var(--muted-fg); opacity:.5 }

  .fn-acoes{ display:flex; gap:3px; justify-content:flex-end; opacity:0; transition:opacity .13s }
  .fn-tbl tbody tr:hover .fn-acoes{ opacity:1 }
  .fn-ib{
    width:25px; height:25px; border:none; background:transparent; color:var(--muted-fg);
    border-radius:6px; cursor:pointer; display:grid; place-items:center; transition:all .13s;
  }
  .fn-ib svg{ width:14px; height:14px; stroke-width:1.8 }
  .fn-ib:hover{ background:var(--secondary); color:var(--fg) }
  .fn-ib.danger:hover{ background:rgba(239,68,68,.14); color:#f87171 }

  .fn-foot{
    padding:10px 16px; font-size:11.5px; color:var(--muted-fg);
    border-top:1px solid var(--border); display:flex;
    justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .fn-nada{ padding:40px 16px; text-align:center; color:var(--muted-fg); font-size:13px }

  @media (max-width:900px){
    .fn-input{ width:160px }
    .fn-tbl thead th, .fn-tbl tbody td{ padding-left:10px; padding-right:10px }
  }
</style>

<div class="page-content fn-page">
  <div class="page-header">
    <div>
      <div class="title-bar">
        <div class="title-accent"></div>
        <h1 class="page-title">Funcionários</h1>
      </div>
      <p class="page-subtitle" style="margin-left:20px" id="fn-sub">Carregando...</p>
    </div>
    <div class="filter-bar fn-bar">
      <div class="fn-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="fn-input" id="fn-busca" placeholder="Buscar pessoa..." oninput="renderFuncionarios()"/>
      </div>
      <select class="fn-select" id="filter-unit" onchange="renderFuncionarios()">
        <option value="ALL">Todas unidades</option>
      </select>
      <select class="fn-select" id="filter-funcao" onchange="renderFuncionarios()">
        <option value="ALL">Todas funções</option>
        <option value="LIDER">Líder</option>
        <option value="ATENDENTE">Atendente</option>
      </select>
      <button class="fn-add" onclick="openAddModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Adicionar
      </button>
    </div>
  </div>

  <div class="fn-wrap">
    <table class="fn-tbl">
      <thead>
        <tr>
          <th class="ord" data-col="nome"   style="width:28%" onclick="ordenarFn('nome')">Nome</th>
          <th class="ord" data-col="funcao" style="width:12%" onclick="ordenarFn('funcao')">Função</th>
          <th class="ord" data-col="unidade" style="width:17%" onclick="ordenarFn('unidade')">Unidade principal</th>
          <th>Também atua em</th>
          <th style="width:95px"></th>
        </tr>
      </thead>
      <tbody id="fn-corpo">
        <tr><td colspan="5" class="fn-nada">Carregando...</td></tr>
      </tbody>
    </table>
    <div class="fn-foot">
      <span id="fn-contagem">—</span>
      <span>Clique no cabeçalho para ordenar</span>
    </div>
  </div>
</div>

<!-- Modal: novo funcionário -->
<div class="modal-overlay" id="modal-add" onclick="closeAddModal()">
  <div class="modal" style="max-width:360px" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>Novo funcionário</span>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="filter-group" style="margin-bottom:12px">
        <label class="filter-label">NOME</label>
        <input class="input" id="new-name" placeholder="Nome completo" style="width:100%"
               onkeydown="if(event.key==='Enter')addEmployee()"/>
      </div>
      <div class="filter-group" style="margin-bottom:12px">
        <label class="filter-label">FUNÇÃO</label>
        <select class="select" id="new-funcao" style="width:100%">
          <option value="ATENDENTE">ATENDENTE</option>
          <option value="LIDER">LÍDER</option>
        </select>
      </div>
      <div class="filter-group" style="margin-bottom:16px">
        <label class="filter-label">UNIDADE</label>
        <select class="select" id="new-unit" style="width:100%"></select>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-outline" onclick="closeAddModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="addEmployee()">Adicionar</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allEmployees = [];
let fnOrdem = {col:'nome', dir:'asc'};

const ICO_MAIS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
const ICO_LIXO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
const ICO_LAPIS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.83 2.83 0 0 0-4-4L4 16v4Z"/><path d="M14.5 6.5 17.5 9.5"/></svg>';
const fnEsc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function onConstantsLoaded() {
  const filterUnit = document.getElementById('filter-unit');
  const newUnit = document.getElementById('new-unit');
  UNITS.forEach(u => {
    const o1 = document.createElement('option'); o1.value = u; o1.textContent = u; filterUnit.appendChild(o1);
    const o2 = document.createElement('option'); o2.value = u; o2.textContent = u; newUnit.appendChild(o2);
  });
  loadEmployees();
}

async function loadEmployees() {
  try {
    const res = await fetch('/api/employees');
    if(res.status === 401){ window.location.href = '/login'; return; }
    allEmployees = res.ok ? await res.json() : [];
  } catch(e) {
    allEmployees = [];
  }
  renderFuncionarios();
}

// Agrupa os registros por pessoa.
// A unidade PRINCIPAL é a primeira na ordem das unidades (a mesma do menu).
function agruparPorPessoa() {
  const ordemUnidade = {};
  (typeof UNITS !== 'undefined' ? UNITS : []).forEach((u,i) => ordemUnidade[u] = i);
  const pos = u => (u in ordemUnidade) ? ordemUnidade[u] : 999;

  const mapa = {};
  allEmployees.forEach(e => {
    const nome = String(e.name || '').trim();
    if(!nome) return;
    if(!mapa[nome]) mapa[nome] = {nome, registros:[], lider:false};
    mapa[nome].registros.push(e);
    if(e.funcao === 'LIDER') mapa[nome].lider = true;
  });

  return Object.keys(mapa).map(nome => {
    const p = mapa[nome];
    p.registros.sort((a,b) => pos(a.unit) - pos(b.unit));
    const principal = p.registros[0];
    return {
      nome: p.nome,
      funcao: p.lider ? 'LIDER' : 'ATENDENTE',
      principal: principal.unit,
      principalId: principal.id,
      outras: p.registros.slice(1).map(r => ({unit:r.unit, id:r.id})),
      unidades: p.registros.map(r => r.unit)
    };
  });
}

function ordenarFn(col) {
  fnOrdem = (fnOrdem.col === col && fnOrdem.dir === 'asc')
    ? {col, dir:'desc'} : {col, dir:'asc'};
  renderFuncionarios();
}

function renderFuncionarios() {
  const corpo = document.getElementById('fn-corpo');
  if(!corpo) return;

  const fUnit   = (document.getElementById('filter-unit')   || {}).value || 'ALL';
  const fFuncao = (document.getElementById('filter-funcao') || {}).value || 'ALL';
  const termo   = ((document.getElementById('fn-busca') || {}).value || '')
                    .trim().toLowerCase();

  let pessoas = agruparPorPessoa();
  const totalGeral = pessoas.length;

  if(fUnit   !== 'ALL') pessoas = pessoas.filter(p => p.unidades.indexOf(fUnit) >= 0);
  if(fFuncao !== 'ALL') pessoas = pessoas.filter(p => p.funcao === fFuncao);
  if(termo)             pessoas = pessoas.filter(p => p.nome.toLowerCase().indexOf(termo) >= 0);

  const dir = fnOrdem.dir === 'asc' ? 1 : -1;
  pessoas.sort((a,b) => {
    let va, vb;
    if(fnOrdem.col === 'funcao')       { va = a.funcao;    vb = b.funcao; }
    else if(fnOrdem.col === 'unidade') { va = a.principal; vb = b.principal; }
    else                               { va = a.nome;      vb = b.nome; }
    const r = String(va).localeCompare(String(vb), 'pt-BR');
    return (r !== 0 ? r : String(a.nome).localeCompare(String(b.nome), 'pt-BR')) * dir;
  });

  // Setas no cabeçalho
  document.querySelectorAll('.fn-tbl thead th.ord').forEach(th => {
    const base = th.textContent.replace(/\s*[▲▼]\s*$/, '');
    th.innerHTML = (th.dataset.col === fnOrdem.col)
      ? base + '<span class="fn-seta">' + (fnOrdem.dir === 'asc' ? '▲' : '▼') + '</span>'
      : base;
  });

  document.getElementById('fn-sub').textContent =
    totalGeral + (totalGeral === 1 ? ' pessoa' : ' pessoas') +
    ' em ' + (typeof UNITS !== 'undefined' ? UNITS.length : 0) + ' unidades';
  document.getElementById('fn-contagem').textContent =
    'Mostrando ' + pessoas.length + ' de ' + totalGeral;

  if(!pessoas.length){
    corpo.innerHTML = '<tr><td colspan="5" class="fn-nada">Nenhum funcionário encontrado.</td></tr>';
    return;
  }

  corpo.innerHTML = pessoas.map(p => {
    const inicial = (p.nome[0] || '?').toUpperCase();
    const ehLider = p.funcao === 'LIDER';
    const chips = p.outras.length
      ? '<div class="fn-chips">' + p.outras.map(o =>
          '<span class="fn-chip">' + fnEsc(o.unit) +
          '<button class="fn-chip-x" title="Tirar de ' + fnEsc(o.unit) + '" ' +
          'onclick="removerDaUnidade(' + o.id + ')">&#10005;</button></span>'
        ).join('') + '</div>'
      : '<span class="fn-vazio">—</span>';

    return '<tr>' +
      '<td><div class="fn-nome-cel">' +
        '<div class="fn-av' + (ehLider ? ' lider' : '') + '">' + fnEsc(inicial) + '</div>' +
        '<span class="fn-nome" title="' + fnEsc(p.nome) + '">' + fnEsc(p.nome) + '</span>' +
      '</div></td>' +
      '<td><span class="fn-func' + (ehLider ? ' lider' : '') + '">' +
        (ehLider ? 'Líder' : 'Atendente') + '</span></td>' +
      '<td><span class="fn-princ"><i></i>' + fnEsc(p.principal) + '</span></td>' +
      '<td>' + chips + '</td>' +
      '<td><div class="fn-acoes">' +
        '<button class="fn-ib" title="Renomear" ' +
          'data-name="' + fnEsc(p.nome) + '" onclick="openRename(this)">' + ICO_LAPIS + '</button>' +
        '<button class="fn-ib" title="Adicionar unidade" ' +
          'data-name="' + fnEsc(p.nome) + '" onclick="openAddUnit(this)">' + ICO_MAIS + '</button>' +
        '<button class="fn-ib danger" title="Remover de ' + fnEsc(p.principal) + '" ' +
          'onclick="removerDaUnidade(' + p.principalId + ')">' + ICO_LIXO + '</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

// ── Diálogo de confirmação no padrão do sistema ──
function fnConfirm(msg, onOk) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay show';
  ov.style.zIndex = 10000;
  ov.innerHTML =
    '<div class="modal" style="max-width:340px">' +
      '<div class="modal-header"><span>Confirmar</span></div>' +
      '<div class="modal-body">' +
        '<p style="font-size:13px;line-height:1.55;color:var(--fg);margin-bottom:18px">' + msg + '</p>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end">' +
          '<button class="btn btn-outline" data-cancel="1">Cancelar</button>' +
          '<button class="btn btn-primary" data-ok="1">Remover</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  ov.addEventListener('click', ev => {
    const t = ev.target;
    if(t === ov || t.getAttribute('data-cancel')) { ov.remove(); return; }
    if(t.getAttribute('data-ok')) { ov.remove(); onOk(); }
  });
  document.body.appendChild(ov);
}

function removerDaUnidade(id) {
  const reg = allEmployees.find(x => x.id === id);
  if(!reg) return;
  const quantas = allEmployees.filter(x => x.name === reg.name).length;
  const msg = quantas <= 1
    ? 'Remover <b>' + fnEsc(reg.name) + '</b> do sistema? É a última unidade dessa pessoa.'
    : 'Tirar <b>' + fnEsc(reg.name) + '</b> da unidade <b>' + fnEsc(reg.unit) + '</b>?' +
      '<br><span style="color:var(--muted-fg);font-size:12px">Ela continua nas outras ' +
      (quantas - 1) + ' unidade' + (quantas - 1 === 1 ? '' : 's') + '.</span>';
  fnConfirm(msg, async () => {
    try {
      await fetch('/api/employees/' + id + '?hard=true', {method:'DELETE'});
      await loadEmployees();
      showToast('Removido.');
    } catch(e) { showToast('Erro ao remover.', 'error'); }
  });
}

// ── Adicionar a pessoa a outra unidade ──
function openAddUnit(btn) {
  const nome = btn.getAttribute('data-name') || '';
  const meus = allEmployees.filter(e => e.name === nome);
  const tem = meus.map(e => e.unit);
  const funcao = (meus[0] && meus[0].funcao) || 'ATENDENTE';
  const livres = (typeof UNITS !== 'undefined' ? UNITS : []).filter(u => tem.indexOf(u) < 0);
  if(!livres.length) { showToast('Já está em todas as unidades.', 'error'); return; }

  const ov = document.createElement('div');
  ov.className = 'modal-overlay show';
  ov.style.zIndex = 10000;
  ov.innerHTML =
    '<div class="modal" style="max-width:300px">' +
      '<div class="modal-header"><span>Adicionar unidade</span></div>' +
      '<div class="modal-body">' +
        '<p style="font-size:12px;color:var(--muted-fg);margin-bottom:12px">' + fnEsc(nome) + '</p>' +
        '<div style="display:flex;flex-direction:column;gap:6px">' +
          livres.map(u => '<button class="btn btn-outline" style="width:100%;justify-content:flex-start" data-u="' + fnEsc(u) + '">' + fnEsc(u) + '</button>').join('') +
        '</div>' +
        '<button class="btn btn-outline" style="margin-top:12px;width:100%" data-cancel="1">Cancelar</button>' +
      '</div>' +
    '</div>';
  ov.addEventListener('click', async ev => {
    const t = ev.target;
    if(t === ov || t.getAttribute('data-cancel')) { ov.remove(); return; }
    const u = t.getAttribute('data-u');
    if(!u) return;
    t.disabled = true;
    try {
      await fetch('/api/employees', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name:nome, unit:u, active:true, funcao:funcao})
      });
      ov.remove();
      await loadEmployees();
      showToast('Unidade adicionada.');
    } catch(e) { ov.remove(); showToast('Erro ao adicionar.', 'error'); }
  });
  document.body.appendChild(ov);
}
// ── Renomear a pessoa em todo o sistema ──
// O nome e a chave do historico. Quem troca aqui, troca no Hora a Hora,
// no comparecimento, nas vendas, nas punicoes, nas metas e nas confirmacoes.
function openRename(btn) {
  const nome = btn.getAttribute('data-name') || '';
  const ov = document.createElement('div');
  ov.className = 'modal-overlay show';
  ov.style.zIndex = 10000;
  ov.innerHTML =
    '<div class="modal" style="max-width:380px">' +
      '<div class="modal-header"><span>Renomear funcionário</span>' +
        '<button class="modal-close" data-cancel="1">✕</button></div>' +
      '<div class="modal-body">' +
        '<div class="filter-group" style="margin-bottom:10px">' +
          '<label class="filter-label">NOME ATUAL</label>' +
          '<input class="input" value="' + fnEsc(nome) + '" disabled style="width:100%;opacity:.55"/>' +
        '</div>' +
        '<div class="filter-group" style="margin-bottom:10px">' +
          '<label class="filter-label">NOVO NOME</label>' +
          '<input class="input" id="rn-novo" value="' + fnEsc(nome) + '" style="width:100%"/>' +
        '</div>' +
        '<p id="rn-aviso" style="font-size:11.5px;line-height:1.5;color:var(--muted-fg);margin-bottom:14px">' +
          'O nome vale para todo o histórico: Hora a Hora, comparecimento, vendas, ' +
          'punições, metas e confirmações.</p>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end">' +
          '<button class="btn btn-outline" data-cancel="1">Cancelar</button>' +
          '<button class="btn btn-primary" data-ok="1">Renomear</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);

  const campo = ov.querySelector('#rn-novo');
  const aviso = ov.querySelector('#rn-aviso');
  const base  = aviso.innerHTML;
  const chave = s => String(s == null ? '' : s).trim().toUpperCase();

  // Avisa ANTES de clicar, se o nome digitado ja pertence a outra pessoa.
  function checar() {
    const v = chave(campo.value);
    const existe = v && v !== chave(nome) &&
      allEmployees.some(e => chave(e.name) === v);
    aviso.innerHTML = existe
      ? '<b style="color:var(--primary)">Já existe alguém com esse nome.</b> ' +
        'As duas viram uma pessoa só e os números somam no histórico. Isso não tem volta.'
      : base;
  }
  campo.addEventListener('input', checar);
  campo.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') ov.querySelector('[data-ok]').click();
  });
  campo.focus();
  campo.select();

  ov.addEventListener('click', async ev => {
    const t = ev.target;
    if (t === ov || (t.closest && t.closest('[data-cancel]'))) { ov.remove(); return; }
    const ok = t.closest && t.closest('[data-ok]');
    if (!ok) return;

    const novo = campo.value.trim();
    if (!novo) { showToast('Digite o novo nome.', 'error'); return; }
    if (novo === nome) { ov.remove(); return; }

    ok.disabled = true;
    ok.textContent = 'Renomeando...';
    try {
      const r = await fetch('/api/employees/rename', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({de: nome, para: novo})
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        showToast(d.error || 'Erro ao renomear.', 'error');
        ok.disabled = false; ok.textContent = 'Renomear';
        return;
      }
      ov.remove();
      await loadEmployees();
      showToast(d.juntou
        ? 'Nomes juntados em um só.'
        : 'Nome trocado em ' + (d.dias || 0) + ' dia(s) de histórico.');
    } catch (e) {
      showToast('Erro ao renomear.', 'error');
      ok.disabled = false; ok.textContent = 'Renomear';
    }
  });
}
// ── Novo funcionário ──
function openAddModal() {
  document.getElementById('modal-add').classList.add('show');
  document.getElementById('new-name').focus();
}
function closeAddModal() {
  document.getElementById('modal-add').classList.remove('show');
  document.getElementById('new-name').value = '';
  const f = document.getElementById('new-funcao');
  if(f) f.value = 'ATENDENTE';
}
async function addEmployee() {
  const name = document.getElementById('new-name').value.trim();
  const unit = document.getElementById('new-unit').value;
  const funcao = document.getElementById('new-funcao').value;
  if(!name) { showToast('Digite um nome.', 'error'); return; }
  try {
    const r = await fetch('/api/employees', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, unit, active:true, funcao})
    });
    if(!r.ok) {
      const d = await r.json().catch(() => ({}));
      showToast(d.error || 'Erro ao adicionar.', 'error');
      return;
    }
    closeAddModal();
    await loadEmployees();
    showToast('Funcionário adicionado.');
  } catch(e) { showToast('Erro ao adicionar.', 'error'); }
}
</script>
{% endblock %}
