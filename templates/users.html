<script>/*USERS-CONFIRM*/(function(){function coConfirm(msg,onOk,okLabel){var ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;display:flex;align-items:center;justify-content:center";ov.innerHTML='<div style="background:#141414;border:1px solid rgba(251,191,36,.35);border-radius:14px;padding:22px 20px;min-width:280px;max-width:360px;box-shadow:0 12px 44px rgba(0,0,0,.6)"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="width:26px;height:26px;border-radius:50%;background:rgba(251,191,36,.15);color:#fbbf24;display:inline-flex;align-items:center;justify-content:center;font-weight:800">!</span><span style="color:#fbbf24;font-weight:700;font-size:14px;letter-spacing:.5px">CONNECTING</span></div><div style="color:#eef1f7;font-size:13.5px;line-height:1.5;margin-bottom:20px">'+msg+'</div><div style="display:flex;gap:8px;justify-content:flex-end"><button data-cancel="1" style="background:#222;border:1px solid #333;color:#cbd5e1;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">Cancelar</button><button data-ok="1" style="background:#fbbf24;border:none;color:#18181b;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700">'+(okLabel||"Confirmar")+'</button></div></div>';ov.addEventListener("click",function(ev){var t=ev.target;if(t===ov||t.getAttribute("data-cancel")){ov.remove();return;}if(t.getAttribute("data-ok")){ov.remove();onOk();}});document.body.appendChild(ov);}window.coConfirm=coConfirm;function install(){if(typeof deleteUser!=="function"){return setTimeout(install,150);}window.deleteUser=function(id,username){coConfirm('Excluir o usuário "'+username+'"?',function(){fetch("/api/users/"+id,{method:"DELETE"}).then(function(res){return res.json().then(function(data){if(!res.ok){showToast(data.error||"Erro ao excluir.","error");return;}loadUsers();showToast("Usuário excluído.");});});},"Excluir");};}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){setTimeout(install,300);});}else{setTimeout(install,300);}})();</script>

{% block scripts %}
<script>
const CURRENT_USER_ID = {{ current_user_id | tojson }};
let allUsers = [];
let pwdTargetId = null;
let roleTargetId = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function ico(nome, tam){
  return '<svg width="' + (tam||16) + '" height="' + (tam||16) + '" viewBox="0 0 24 24"' +
         ' fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"' +
         ' stroke-linejoin="round" aria-hidden="true"><use href="#i-' + nome + '"/></svg>';
}

/* ---- Acesso personalizado -------------------------------------------- */
// As chaves tem que bater EXATAMENTE com PERM_TELAS do database.py.
// Tela desconhecida e descartada no servidor, sem erro — some calada.
const TELAS = [
  ['resumo',         'Resumo Geral'],
  ['acompanhamento', 'Acompanhamento'],
  ['faltas',         'Faltas / Advertências'],
  ['leads',          'Leads Recebidos'],
  ['leadshh',        'Leads HxH'],
  ['fechamento',     'Fechamento'],
  ['crm',            'Troca CRM'],
  ['funcionarios',   'Funcionários'],
  ['ajustes',        'Ajustes'],
];
const NOME_TELA = {};
TELAS.forEach(t => { NOME_TELA[t[0]] = t[1]; });

// papel -> rotulo, icone e cor. Uma fonte so para a tabela inteira.
const PAPEIS = {
  all:           {txt:'Acesso total',  ic:'escudo',  cor:'#fbbf24'},
  admin:         {txt:'Acesso total',  ic:'escudo',  cor:'#fbbf24'},
  agendamento:   {txt:'Agendamento',   ic:'agenda',  cor:'#60a5fa'},
  confirmacao:   {txt:'Confirmação',   ic:'check',   cor:'#4ade80'},
  ambos:         {txt:'Agend. e Confirm.', ic:'duplo', cor:'#c084fc'},
  personalizado: {txt:'Personalizado', ic:'pessoa',  cor:'#fb7185'},
};
function papelDe(r){ return PAPEIS[r] || PAPEIS.all; }

let LISTA_UNIDADES = [];
let LISTA_ATENDENTES = [];

async function carregaListas(){
  if(LISTA_UNIDADES.length || LISTA_ATENDENTES.length) return;
  try{
    const [ru, ra] = await Promise.all([
      fetch('/api/unidades'), fetch('/api/atendentes')
    ]);
    if(ru.ok) LISTA_UNIDADES   = (await ru.json()).map(x => x.nome);
    if(ra.ok) LISTA_ATENDENTES = (await ra.json()).map(x => x.nome);
  }catch(e){ console.warn('Nao consegui carregar unidades/atendentes:', e); }
}

function chip(pref, grupo, valor, rotulo, marcado){
  const id = 'pm-' + pref + '-' + grupo + '-' +
             String(valor).replace(/[^a-zA-Z0-9]/g, '');
  return '<label class="perm-chip" for="' + id + '">' +
           '<input type="checkbox" id="' + id + '" data-g="' + grupo +
           '" value="' + esc(valor) + '"' + (marcado ? ' checked' : '') + '>' +
           '<span>' + esc(rotulo) + '</span></label>';
}

async function montaPainel(pref, perm){
  await carregaListas();
  perm = perm || {};
  const tem = (lst, v) => (lst || []).some(
    x => String(x).toUpperCase() === String(v).toUpperCase());
  const vazio = '<span class="perm-vazio">nada cadastrado</span>';
  const box = document.getElementById('perm-' + pref);

  box.innerHTML =
    '<div class="perm-sec">' + ico('agenda', 13) + 'Agendamentos</div>' +
    '<div class="perm-sub">Unidades <button type="button" class="perm-todos" data-alvo="u">todas</button></div>' +
    '<div class="perm-chips" data-bloco="u">' +
      (LISTA_UNIDADES.length
        ? LISTA_UNIDADES.map(n => chip(pref,'unidades',n,n,tem(perm.unidades,n))).join('')
        : vazio) +
    '</div>' +
    '<div class="perm-sub">Telas <button type="button" class="perm-todos" data-alvo="t">todas</button></div>' +
    '<div class="perm-chips" data-bloco="t">' +
      TELAS.map(t => chip(pref,'telas',t[0],t[1],tem(perm.telas,t[0]))).join('') +
    '</div>' +
    '<div class="perm-sec">' + ico('check', 13) + 'Confirmação</div>' +
    '<div class="perm-sub">Atendentes <button type="button" class="perm-todos" data-alvo="a">todas</button></div>' +
    '<div class="perm-chips" data-bloco="a">' +
      (LISTA_ATENDENTES.length
        ? LISTA_ATENDENTES.map(n => chip(pref,'atendentes',n,n,tem(perm.atendentes,n))).join('')
        : vazio) +
    '</div>' +
    '<div class="perm-sub">Outras</div>' +
    '<div class="perm-chips">' +
      chip(pref,'conf_geral','1','Análise Geral', !!perm.conf_geral) +
      chip(pref,'conf_equipe','1','Equipe', !!perm.conf_equipe) +
    '</div>';

  box.querySelectorAll('.perm-todos').forEach(b => {
    b.onclick = function(){
      const bloco = box.querySelector('[data-bloco="' + b.dataset.alvo + '"]');
      if(!bloco) return;
      const ins = bloco.querySelectorAll('input[type=checkbox]');
      // se faltar algum desmarcado, marca tudo; se ja estava tudo marcado, limpa
      let marcar = false;
      ins.forEach(i => { if(!i.checked) marcar = true; });
      ins.forEach(i => { i.checked = marcar; });
    };
  });
}

function lePainel(pref){
  const out = {unidades: [], telas: [], atendentes: [],
               conf_geral: false, conf_equipe: false};
  const box = document.getElementById('perm-' + pref);
  if(!box) return out;
  box.querySelectorAll('input[type=checkbox]').forEach(i => {
    if(!i.checked) return;
    const g = i.dataset.g;
    if(g === 'conf_geral' || g === 'conf_equipe') out[g] = true;
    else if(out[g]) out[g].push(i.value);
  });
  return out;
}

async function togglePainel(pref){
  const sel = document.getElementById(pref === 'add' ? 'new-role' : 'edit-role');
  const box = document.getElementById('perm-' + pref);
  const custom = sel.value === 'personalizado';
  box.style.display = custom ? 'block' : 'none';
  if(custom && !box.innerHTML.trim()) await montaPainel(pref, box._perm);
}

async function salvaPermissoes(id, perm){
  const r = await fetch('/api/users/' + id + '/permissoes', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({permissoes: perm})
  });
  if(!r.ok){
    const d = await r.json().catch(() => ({}));
    throw new Error(d.error || 'Erro ao salvar os acessos.');
  }
}

// A frase da coluna "O que acessa". E o unico lugar da tela que conta,
// em palavras, o que foi marcado nos checkboxes.
function resumoAcesso(u){
  if(u.role === 'agendamento') return 'Todas as unidades';
  if(u.role === 'confirmacao') return 'Todas as atendentes';
  if(u.role === 'ambos')       return 'As duas áreas, sem os ajustes';
  if(u.role !== 'personalizado') return 'Tudo, inclusive os ajustes';

  const p = u.permissoes || {};
  const partes = [];
  if((p.unidades || []).length)
    partes.push('<span class="forte">' + p.unidades.map(esc).join(', ') + '</span>');
  if((p.telas || []).length)
    partes.push(p.telas.map(t => esc(NOME_TELA[t] || t)).join(', '));
  if((p.atendentes || []).length)
    partes.push('<span class="forte">' + p.atendentes.map(esc).join(', ') + '</span>');
  const extra = [];
  if(p.conf_geral)  extra.push('Análise Geral');
  if(p.conf_equipe) extra.push('Equipe');
  if(extra.length) partes.push(extra.join(', '));

  if(!partes.length) return '<span class="alerta">Nada liberado</span>';
  return partes.join(' · ');
}

/* ---- Tela -------------------------------------------------------------- */
function onConstantsLoaded() {
  // O <select> continua sendo o dono do valor — o dropdown so troca a aparencia.
  if(typeof ligaDropdown === 'function'){
    ligaDropdown('new-role',  'Buscar equipe');
    ligaDropdown('edit-role', 'Buscar equipe');
  }
  loadUsers();
}

async function loadUsers() {
  const res = await fetch('/api/users');
  if(res.status === 401) { window.location.href='/login'; return; }
  allUsers = await res.json();
  render();
}

function render() {
  const corpo = document.getElementById('users-grid');
  const sub   = document.getElementById('us-sub');
  const campo = document.getElementById('us-filtro');
  const busca = (campo ? campo.value : '').trim().toLowerCase();

  if(sub) sub.textContent = allUsers.length === 1
    ? '1 pessoa com acesso ao sistema'
    : allUsers.length + ' pessoas com acesso ao sistema';

  if(allUsers.length === 0){
    corpo.innerHTML = '<tr><td colspan="4" class="us-nada">' +
      'Ninguém cadastrado ainda. Use “Novo usuário” para começar.</td></tr>';
    return;
  }

  const lista = busca
    ? allUsers.filter(u => String(u.username).toLowerCase().includes(busca))
    : allUsers;

  if(lista.length === 0){
    corpo.innerHTML = '<tr><td colspan="4" class="us-nada">' +
      'Nenhum usuário com “' + esc(busca) + '” no nome.</td></tr>';
    return;
  }

  corpo.innerHTML = lista.map(u => {
    const isMe = u.id === CURRENT_USER_ID;
    const pa   = papelDe(u.role);
    const letra = String(u.username || '?').charAt(0).toUpperCase();
    const nomeSeguro = String(u.username).replace(/'/g, "\\'");
    // Em si mesmo, so a chave: ninguem se rebaixa nem se exclui sem querer.
    const btAcessos = isMe
      ? '<button class="us-ac off" tabindex="-1" aria-hidden="true"></button>'
      : '<button class="us-ac" title="Acessos" aria-label="Acessos de ' + esc(u.username) +
        '" onclick="openRoleModal(' + u.id + ')">' + ico('acessos') + '</button>';
    const btExcluir = isMe
      ? '<button class="us-ac off" tabindex="-1" aria-hidden="true"></button>'
      : '<button class="us-ac x" title="Excluir" aria-label="Excluir ' + esc(u.username) +
        '" onclick="deleteUser(' + u.id + ", '" + nomeSeguro + "')\">" + ico('lixo') + '</button>';

    return '<tr style="--c:' + pa.cor + '">' +
      '<td><div class="us-pessoa"><div class="us-mono">' + esc(letra) + '</div>' +
        '<span class="us-nome">' + esc(u.username) +
        (isMe ? '<span class="us-voce">você</span>' : '') + '</span></div></td>' +
      '<td><span class="us-selo">' + ico(pa.ic, 13) + esc(pa.txt) + '</span></td>' +
      '<td class="us-detalhe">' + resumoAcesso(u) + '</td>' +
      '<td><div class="us-acs">' + btAcessos +
        '<button class="us-ac k" title="Trocar senha" aria-label="Trocar a senha de ' +
          esc(u.username) + '" onclick="openPwdModal(' + u.id + ", '" + nomeSeguro +
          "')\">" + ico('chave') + '</button>' +
        btExcluir + '</div></td>' +
    '</tr>';
  }).join('');
}

function openAddModal() {
  document.getElementById('modal-add').classList.add('show');
  document.getElementById('new-username').value = '';
  document.getElementById('new-password').value = '';
  document.getElementById('new-role').value = 'all';
  if(typeof atualizaDropdown === 'function') atualizaDropdown('new-role');
  const box = document.getElementById('perm-add');
  box.innerHTML = '';
  box._perm = null;
  box.style.display = 'none';
  document.getElementById('new-username').focus();
}
function closeAddModal() { document.getElementById('modal-add').classList.remove('show'); }

async function addUser() {
  const username = document.getElementById('new-username').value.trim();
  const password = document.getElementById('new-password').value;
  if(!username) { showToast('Digite um nome de usuário.','error'); return; }
  if(password.length < 8) { showToast('A senha precisa ter pelo menos 8 caracteres.','error'); return; }
  const role = document.getElementById('new-role').value;
  const res = await fetch('/api/users', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password, role})
  });
  const data = await res.json();
  if(!res.ok) {
    showToast(data.error || 'Erro ao criar usuário.', 'error');
    return;
  }
  // O usuario nasce primeiro; os acessos vao logo em seguida. Se este
  // segundo passo falhar, a pessoa existe mas sem nenhum acesso marcado —
  // e o aviso diz isso, em vez de fingir que deu tudo certo.
  if(role === 'personalizado'){
    try{
      // Nem toda rota devolve o id do usuario novo. Se nao vier, acho
      // pelo nome na lista recarregada — que acabou de ser criado.
      let novoId = data.id;
      if(!novoId){
        await loadUsers();
        const achado = allUsers.find(x => x.username === username);
        novoId = achado ? achado.id : null;
      }
      if(!novoId) throw new Error('Não consegui identificar o usuário criado.');
      await salvaPermissoes(novoId, lePainel('add'));
    }catch(e){
      closeAddModal();
      await loadUsers();
      showToast('Usuário criado, mas os acessos não foram salvos. Abra os acessos e marque de novo.', 'error');
      return;
    }
  }
  closeAddModal();
  await loadUsers();
  showToast('Usuário criado.');
}

async function deleteUser(id, username) {
  if(!confirm(`Excluir o usuário "${username}"?`)) return;
  const res = await fetch(`/api/users/${id}`, { method:'DELETE' });
  const data = await res.json();
  if(!res.ok) {
    showToast(data.error || 'Erro ao excluir.', 'error');
    return;
  }
  await loadUsers();
  showToast('Usuário excluído.');
}

function openPwdModal(id, username) {
  pwdTargetId = id;
  document.getElementById('pwd-username').textContent = username;
  document.getElementById('new-pwd').value = '';
  document.getElementById('modal-pwd').classList.add('show');
  document.getElementById('new-pwd').focus();
}
function closePwdModal() { document.getElementById('modal-pwd').classList.remove('show'); pwdTargetId = null; }

async function openRoleModal(id) {
  const u = allUsers.find(x => x.id === id);
  if(!u) return;
  roleTargetId = id;
  document.getElementById('role-username').textContent = u.username;
  document.getElementById('edit-role').value = u.role || 'all';
  if(typeof atualizaDropdown === 'function') atualizaDropdown('edit-role');
  const box = document.getElementById('perm-edit');
  box.innerHTML = '';
  box._perm = u.permissoes || null;
  box.style.display = 'none';
  document.getElementById('modal-role').classList.add('show');
  await togglePainel('edit');
}
function closeRoleModal() { document.getElementById('modal-role').classList.remove('show'); roleTargetId = null; }

async function saveRole() {
  const role = document.getElementById('edit-role').value;
  const alvo = roleTargetId;
  const res = await fetch(`/api/users/${alvo}/role`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({role})
  });
  const data = await res.json();
  if(!res.ok) { showToast(data.error || 'Erro ao alterar equipe.', 'error'); return; }
  if(role === 'personalizado'){
    try{
      await salvaPermissoes(alvo, lePainel('edit'));
    }catch(e){
      await loadUsers();
      showToast(e.message, 'error');
      return;
    }
  }
  closeRoleModal();
  await loadUsers();
  showToast('Acessos atualizados.');
}

async function savePassword() {
  const pwd = document.getElementById('new-pwd').value;
  if(pwd.length < 8) { showToast('A senha precisa ter pelo menos 8 caracteres.','error'); return; }
  const res = await fetch(`/api/users/${pwdTargetId}/password`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: pwd})
  });
  const data = await res.json();
  if(!res.ok) {
    showToast(data.error || 'Erro ao trocar senha.', 'error');
    return;
  }
  closePwdModal();
  showToast('Senha alterada.');
}
</script>
{% endblock %}
